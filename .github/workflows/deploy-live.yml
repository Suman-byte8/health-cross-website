# Deploys the site to the main domain over FTP.
#
# Normal pushes to main do NOT run this — they only update the Netlify
# preview URL (Netlify builds on its own from the GitHub repo).
#
# The live FTP deploy runs only when:
#   1. a commit pushed to main has "[deploy-live]" in its message
#      (shortcut: `npm run deploy:live`), or
#   2. it is started by hand: GitHub → Actions → "Deploy to live (FTP)" → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      e.g. ftp.yourdomain.com
#   FTP_USERNAME
#   FTP_PASSWORD
# Optional:
#   FTP_SERVER_DIR  remote folder relative to the FTP login folder, must end
#                   with "/" (default: ./ — the FTP account already opens
#                   inside public_html, so don't add public_html again)

name: Deploy to live (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-live]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
